name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-server:
    name: Analyze Backend
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          source-root: server

      - name: Install and build
        run: |
          cd server
          npm ci
          npm run build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "server"

  analyze-frontend:
    name: Analyze Frontend
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          source-root: frontend

      - name: Install
        run: |
          cd frontend
          npm ci

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "frontend"
